name: UpgradeMachines
version: '1.0.0'
main: net.plugin.upgrademachines.UpgradeMachinesPlugin
api-version: '26.2'
author: Claude
softdepend: [Vault]
description: 'ปลั๊กอินอัพเกรดเตาเผา (Furnace/BlastFurnace/Smoker), Hopper, Dispenser และ Crafter แบบวานิลลา - อัพเกรดแต่ละขั้นเพิ่มแค่ "อัตราเร็ว" เท่านั้น ไม่มีไอเทม/สูตรใหม่ กด Shift+คลิกขวาที่บล็อกเพื่ออัพเกรด ราคาอัพเกรดตั้งค่าได้ (เงินผ่าน Vault และ/หรือไอเทม)'

commands:
  upgrade:
    description: จัดการการอัพเกรดเครื่องจักร
    usage: /<command> [info|reload]

permissions:
  upgrademachine.use:
    description: อนุญาตให้ Shift+คลิกขวาอัพเกรดบล็อก
    default: true
  upgrademachine.admin:
    description: อนุญาตให้ reload config
    default: op
