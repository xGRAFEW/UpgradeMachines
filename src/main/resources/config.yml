# =========================================================
#  UpgradeMachines - ตั้งค่าอัตราการทำงาน + ราคาตามระดับอัพเกรด
#  หลักการ: index ของ list = ระดับอัพเกรด (index 0 = ยังไม่อัพเกรด/ปกติแบบวานิลลา, ไม่มีราคา)
#  ทุกอย่างในนี้ "เพิ่มอัตราเท่านั้น" ไม่มีการเพิ่มไอเทมหรือสูตรใหม่
#
#  ราคา (price):
#    - money  : ราคาเป็นเงิน (ต้องมี Vault + ปลั๊กอินระบบเงิน เช่น EssentialsX ติดตั้งด้วย)
#               ถ้าไม่มี Vault ส่วนนี้จะถูกข้ามอัตโนมัติ (ไม่บังคับต้องมี)
#    - item   : ราคาเป็นไอเทม ระบุ material 1 ชนิด + จำนวนต่อระดับ
#               ถ้าไม่ต้องการเก็บราคาไอเทม ให้ตั้ง material เป็นค่าว่าง ""
#    - ทั้งสองแบบใช้พร้อมกันได้ (ต้องจ่ายทั้งคู่ถ้าตั้งไว้ทั้งคู่)
#    - ลดระดับ (shift+คลิกขวา) ไม่มีการคืนเงิน/ไอเทม
# =========================================================

# ---------------------------------------------------------
#  หน้าตากล่องยืนยันอัพเกรด (เปิดจาก Shift+คลิกขวาที่บล็อก) + ชื่อ/lore
#  ของไอเทมที่ดรอปออกมาตอนทุบบล็อกที่อัพเกรดแล้ว - แก้ข้อความ/สี/ไอเทมได้อิสระ
#
#  Placeholder ที่ใช้ได้ในทุกช่องข้อความด้านล่าง:
#    {name}    ชื่อเครื่อง ณ ระดับที่กำลังอัพเกรดไป (จาก display-names.<MATERIAL> ถ้าตั้งไว้ ไม่งั้น fallback ไปที่ display-name ของแต่ละเครื่อง - ทั้งคู่ตั้งเป็นชื่อเดียวหรือ list แยกตามระดับก็ได้ ดูตัวอย่างในแต่ละเครื่องด้านล่าง)
#    {level}         ระดับเป้าหมาย เป็นตัวเลข (1, 2, 3, ...)
#    {current}       ระดับปัจจุบัน เป็นตัวเลข
#    {max}           ระดับสูงสุด เป็นตัวเลข
#    {level-roman}   ระดับเป้าหมาย เป็นเลขโรมัน (I, II, III, IV, V, ...) - ใช้แบบนี้เป็นค่า default อยู่แล้ว
#    {current-roman} ระดับปัจจุบัน เป็นเลขโรมัน
#    {max-roman}     ระดับสูงสุด เป็นเลขโรมัน
#    {rate}          ตัวเลขดิบล้วน ๆ ของระดับเป้าหมาย (ตัวเดียวกับที่ effect-format เอาไปประกอบเป็น {effect}) เช่น 16 เฉย ๆ
#    {effect}        ข้อความผลลัพธ์เต็ม (จาก effect-format) เช่น "เผาทีละ: 16 ชิ้น"
#    {price}         ราคาสรุปสั้น ๆ เช่น "500 + 8x IRON_INGOT" หรือ "ฟรี" - ตัวเลข/ชื่อไอเทมในนี้ไม่มีสีบังคับของตัวเอง
#                    สีที่ใส่ไว้ก่อน {price} จะมีผลจริง ยกเว้นข้อความ "ฟรี"/ตัวคั่น "+" ที่ตั้งสีแยกได้ที่ price-free/price-separator ด้านล่าง
#  สีใช้โค้ด & (เช่น &a เขียว &c แดง &b ฟ้า &7 เทา &l ตัวหนา) หรือ hex แบบ &#RRGGBB ก็ได้ ระบบแปลงให้อัตโนมัติ
#  material ของไอเทม/ปุ่ม ใช้ชื่อ Material ของ Bukkit (ตัวพิมพ์ใหญ่ขีดล่าง)
# ---------------------------------------------------------
gui:
  # รูปแบบตอน Shift+คลิกขวา:
  #   inventory (default) - เปิดกล่องยืนยัน/ยกเลิกแบบ 27 ช่องด้านล่างทั้งหมด
  #   actionbar           - ไม่เปิดกล่องเลย ขึ้นข้อความ prompt ด้านล่างจอแทน (ดู actionbar: ด้านล่าง)
  #                          Shift+คลิกขวาซ้ำที่บล็อกเดิมภายในเวลาที่กำหนดถือว่ายืนยัน ใช้งานง่ายกว่าบนมือถือ
  #                          (ไม่ต้องเล็งแตะช่องเล็ก ๆ ในกริด) แต่โชว์รายละเอียดได้น้อยกว่ากล่อง inventory
  #                          ไม่มีกรอบ/พื้นหลังสวย ๆ ให้เอง (เป็นตัวหนังสือลอยเฉย ๆ ตามธรรมชาติของ action bar)
  #   dialog               - เปิดกล่อง "Dialog" แบบวานิลลาจริง (ฟีเจอร์ Dialogs ของเกม ไม่ใช่ inventory hack)
  #                          มีกรอบ/พื้นหลังสวยงามให้เองโดยไม่ต้องมี resource pack และมีปุ่มยืนยัน/ยกเลิกจริง
  #                          กดง่ายกว่าบนมือถือกว่าเปิดกล่อง inventory (ดู dialog: ด้านล่าง)
  #                          ต้องใช้ไคลเอนต์เวอร์ชันที่รองรับฟีเจอร์ Dialogs ไม่งั้นอาจใช้งานไม่ได้
  style: "inventory"

  # ตั้งค่าเฉพาะตอน style: "actionbar" (ไม่มีผลถ้าใช้ style อื่น)
  actionbar:
    # ข้อความ prompt ที่ขึ้นตอนคลิกครั้งแรก ใช้ placeholder เดียวกับด้านบนได้ทั้งหมด
    prompt-format: "&e→ &fคลิกขวาอีกครั้งเพื่ออัปเกรดเป็น: &a{level-roman} &fในราคา: &6{price}"
    # จำนวนวินาทีที่คลิกครั้งที่สองยังนับเป็นการยืนยัน (คลิกช้ากว่านี้ = เริ่ม prompt ใหม่)
    timeout-seconds: 6

  # ตั้งค่าเฉพาะตอน style: "dialog" (ไม่มีผลถ้าใช้ style อื่น)
  dialog:
    title-format: "&8อัพเกรด {name}"
    # บรรทัด body ทั้งหมดจะถูกต่อเป็นข้อความเดียว (เว้นบรรทัดปกติ) ไม่ใช่แยกเป็นกล่องละบรรทัด - ระยะห่างเลยแน่นกว่า
    body:
      - "&7ระดับ: &f{current-roman} &7→ &a{level-roman}&7/{max-roman}"
      - "&7ผล: &f{effect}"
      - "&7ราคา: &f{price}"
    # ปุ่มเรียงแนวตั้ง (ยืนยันอยู่บน ยกเลิกอยู่ใต้) - ปุ่มยืนยันมี 2 บรรทัด (\n) แสดงสรุปสั้น ๆ ไว้ด้วย
    confirm-label: "&a&lยืนยันอัพเกรด\n&7Lv.{level-roman} - {price}"
    cancel-label: "&c&lยกเลิก"

  # แถบหัวกล่อง (title bar, เฉพาะ style: "inventory") - แสดงบรรทัดเดียว ยาวเกินไคลเอนต์จะตัด/scroll เอง
  title-format: "&8{name} &f{effect} &7- {price}"

  # ข้อความ {price} ตอนไม่มีอะไรต้องจ่าย / ตัวคั่นระหว่างราคาเงินกับราคาไอเทมตอนมีทั้งคู่ (ใช้ร่วมกันทั้ง 2 style)
  price-free: "&aฟรี"
  price-separator: "&7 + "

  # ไอเทมกลางกล่อง (ช่อง 13) สรุประดับ/ผล/ราคา - ไอคอนใช้บล็อกที่กำลังอัพเกรดเสมอ เปลี่ยน material ไม่ได้
  info-item:
    name-format: "&b&l{name} &f→ &bLv.{level-roman}"
    lore:
      - "&7ระดับ: &f{current-roman} &7→ &a{level-roman}&7/{max-roman}"
      - "&7ผล: &f{effect}"
      - ""
      - "&7ราคา: &f{price}"

  confirm-button:
    material: LIME_STAINED_GLASS_PANE
    name: "&a&lยืนยันอัพเกรด"
    lore:
      - "&7คลิกเพื่อยืนยันการอัพเกรด"

  cancel-button:
    material: RED_STAINED_GLASS_PANE
    name: "&c&lยกเลิกการอัพเกรด"
    lore:
      - "&7ปิดกล่องนี้โดยไม่เสียเงิน/ไอเทม"

  # ไอเทมที่ใช้เติมช่องว่างในกล่อง (ไม่มีชื่อ/lore)
  filler:
    material: GRAY_STAINED_GLASS_PANE

  # ชื่อ/lore ของไอเทมที่ดรอปออกมาตอนทุบบล็อกที่อัพเกรดแล้ว (ดูกลไกเต็ม ๆ ใน README หัวข้อ "ทุบ/วางบล็อกที่อัพเกรดแล้ว")
  # ที่นี่ {level} = {current} = ระดับของไอเทมนั้น ๆ (ไม่มีแนวคิดเป้าหมาย/ปัจจุบันต่างกันแบบในกล่องยืนยัน)
  item-name-format: "&b{name} &f→ &bLv.{level-roman}"
  item-lore-format:
    - "&7{effect}"

furnace:
  # รองรับ Furnace, Blast Furnace, Smoker ทุกชนิดในตัวเดียว (อัตราเผา/max-level/ราคาใช้ค่าเดียวกันทั้ง 3 ชนิด)
  # ชื่อที่แสดงในเมนู/ข้อความ/ไอเทมที่ดรอปออกมา - ค่านี้คือชื่อ default/fallback ถ้าไม่ได้ตั้ง display-names ด้านล่างแยกเป็นรายบล็อก
  # ตั้งเป็นข้อความเดียว (ใช้ทุกระดับ) หรือ list แยกตามระดับก็ได้ (index 0 = ยังไม่อัพเกรด, index 1 = Lv.1, ...)
  display-name: "เตาเผา"
  # ชื่อแยกเฉพาะแต่ละชนิดบล็อก (ไม่บังคับต้องตั้งครบ) - ถ้าไม่ตั้งชนิดไหนจะ fallback ไปใช้ display-name ด้านบนแทน
  # แต่ละชนิดตั้งเป็นข้อความเดียวหรือ list แยกตามระดับก็ได้เหมือนกัน (ด้านล่างนี้ตั้งเป็น list แยกตามระดับไว้ให้ดูตัวอย่าง - แก้ชื่อได้ตามใจ)
  display-names:
    FURNACE: ["เตาเผา", "เตาเผาทองแดง", "เตาเผาเหล็ก", "เตาเผาทอง", "เตาเผาเพชร"]
    BLAST_FURNACE: ["เตาถลุงแร่", "เตาถลุงแร่ทองแดง", "เตาถลุงแร่เหล็ก", "เตาถลุงแร่ทอง", "เตาถลุงแร่เพชร"]
    SMOKER: ["เตาอบรมควัน", "เตาอบรมควันทองแดง", "เตาอบรมควันเหล็ก", "เตาอบรมควันทอง", "เตาอบรมควันเพชร"]
  max-level: 4
  # ข้อความเอฟเฟค (โผล่ที่ {effect} ในกล่องยืนยัน/ไอเทมที่ดรอป) - {rate} = ตัวเลขจาก smelt-batch-size ด้านล่าง (แก้ได้แค่ข้อความ ตัวเลขยังต้องมาจาก list)
  effect-format: "เผาทีละ: {rate} ชิ้น"
  # จำนวนชิ้นที่เผาได้ต่อ 1 รอบเผา (เวลาต่อรอบเท่าวานิลลาเดิม ไม่เปลี่ยน)
  # index 0 ต้องเป็น 1 เสมอ (วานิลลาปกติ = เผาทีละ 1 ชิ้น)
  # เชื้อเพลิงยังใช้เท่าวานิลลาปกติ - ไม่ได้เพิ่มตามจำนวนที่เผา (ยิ่งอัพเกรดสูงยิ่งคุ้มเชื้อเพลิง)
  smelt-batch-size: [1, 8, 16, 24, 32]
  price:
    money: [0, 500, 1500, 3000, 6000]
    item:
      material: ""
      amounts: [0, 8, 16, 32, 64]

hopper:
  # ตั้งเป็นข้อความเดียวหรือ list แยกตามระดับก็ได้ (index 0 = ยังไม่อัพเกรด, ...) - ด้านล่างนี้เป็น list ตัวอย่าง
  display-name: ["ฮอปเปอร์", "ฮอปเปอร์ทองแดง", "ฮอปเปอร์เหล็ก", "ฮอปเปอร์ทอง", "ฮอปเปอร์เพชร", "ฮอปเปอร์เนเธอร์ไรต์"]
  max-level: 5
  # {rate} = 1 + extra-transfers ของระดับนั้น (จำนวนไอเทมที่ย้ายได้จริงต่อรอบ)
  effect-format: "ส่งทีละ: {rate} ชิ้น"
  # ปกติ hopper ย้าย 1 ชิ้น/8 ticks — ค่านี้คือ "จำนวนไอเทมพิเศษ" ที่ย้ายเพิ่มในรอบเดียวกัน
  extra-transfers: [0, 1, 2, 3, 4, 6]
  price:
    money: [0, 300, 800, 1500, 2500, 4000]
    item:
      material: ""
      amounts: [0, 4, 8, 16, 24, 32]

dispenser:
  display-name: ["ดิสเพนเซอร์", "ดิสเพนเซอร์ทองแดง", "ดิสเพนเซอร์เหล็ก", "ดิสเพนเซอร์ทอง", "ดิสเพนเซอร์เพชร", "ดิสเพนเซอร์เนเธอร์ไรต์"]
  max-level: 5
  # {rate} = 1 + extra-items ของระดับนั้น (จำนวนไอเทมที่ยิงจริงต่อครั้ง)
  effect-format: "ยิงทีละ: {rate} ชิ้น"
  # จำนวนไอเทมพิเศษที่ยิง/ดันออกเพิ่ม ต่อการทำงาน 1 ครั้ง (นอกเหนือจากของปกติ 1 ชิ้น)
  extra-items: [0, 1, 2, 3, 4, 5]
  price:
    money: [0, 300, 800, 1500, 2500, 4000]
    item:
      material: ""
      amounts: [0, 8, 16, 32, 48, 64]

dropper:
  display-name: ["ดรอปเปอร์", "ดรอปเปอร์ทองแดง", "ดรอปเปอร์เหล็ก", "ดรอปเปอร์ทอง", "ดรอปเปอร์เพชร", "ดรอปเปอร์เนเธอร์ไรต์"]
  max-level: 5
  # {rate} = 1 + extra-items ของระดับนั้น (จำนวนไอเทมที่ดรอปจริงต่อครั้ง)
  effect-format: "ดรอปทีละ: {rate} ชิ้น"
  # จำนวนไอเทมพิเศษที่ดันออกเพิ่ม ต่อการทำงาน 1 ครั้ง (นอกเหนือจากของปกติ 1 ชิ้น)
  extra-items: [0, 1, 2, 3, 4, 5]
  price:
    money: [0, 300, 800, 1500, 2500, 4000]
    item:
      material: ""
      amounts: [0, 8, 16, 32, 48, 64]

crafter:
  display-name: ["คราฟเตอร์", "คราฟเตอร์ทองแดง", "คราฟเตอร์เหล็ก", "คราฟเตอร์ทอง", "คราฟเตอร์เพชร", "คราฟเตอร์เนเธอร์ไรต์"]
  max-level: 5
  # {rate} = 1 + cooldown-reduction-ticks ของระดับนั้น (จำนวนครั้งที่คราฟได้จริงต่อทริกเกอร์)
  effect-format: "คราฟทีละ: {rate} ครั้ง"
  # จำนวนครั้งที่คราฟเพิ่มเติมต่อการทริกเกอร์ 1 ครั้ง (ใช้วัตถุดิบซ้ำจากช่องเดิม)
  # หมายเหตุ: Crafter เป็นบล็อกใหม่ (1.21+) API ยังไม่นิ่งเท่า furnace/hopper/dispenser
  cooldown-reduction-ticks: [0, 1, 2, 2, 3, 4]
  price:
    money: [0, 500, 1200, 2200, 3500, 5000]
    item:
      material: ""
      amounts: [0, 4, 8, 12, 16, 20]
