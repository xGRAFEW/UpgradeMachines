# =========================================================
#  UpgradeMachines - ตั้งค่าอัตราการทำงาน + ราคาตามระดับอัพเกรด
#  หลักการ: index ของ list = ระดับอัพเกรด (index 0 = ยังไม่อัพเกรด/ปกติแบบวานิลลา, ไม่มีราคา)
#  ทุกอย่างในนี้ "เพิ่มอัตราเท่านั้น" ไม่มีการเพิ่มไอเทมหรือสูตรใหม่
#
#  ราคา (price):
#    - money  : ราคาเป็นเงิน (ต้องมี Vault + ปลั๊กอินระบบเงิน เช่น EssentialsX ติดตั้งด้วย)
#               ถ้าไม่มี Vault ส่วนนี้จะถูกข้ามอัตโนมัติ (ไม่บังคับต้องมี)
#    - item   : ราคาเป็นไอเทม ระบุ material 1 ชนิด + จำนวนต่อระดับ
#               ถ้าไม่ต้องการเก็บราคาไอเทม ให้ตั้ง material เป็นค่าว่าง ""
#    - ทั้งสองแบบใช้พร้อมกันได้ (ต้องจ่ายทั้งคู่ถ้าตั้งไว้ทั้งคู่)
#    - ลดระดับ (shift+คลิกขวา) ไม่มีการคืนเงิน/ไอเทม
# =========================================================

furnace:
  # รองรับ Furnace, Blast Furnace, Smoker ทุกชนิดในตัวเดียว
  # ชื่อที่แสดงในเมนู/ข้อความ/ไอเทมที่ดรอปออกมา (แก้ได้อิสระ)
  display-name: "เตาเผา"
  max-level: 4
  # จำนวนชิ้นที่เผาได้ต่อ 1 รอบเผา (เวลาต่อรอบเท่าวานิลลาเดิม ไม่เปลี่ยน)
  # index 0 ต้องเป็น 1 เสมอ (วานิลลาปกติ = เผาทีละ 1 ชิ้น)
  # เชื้อเพลิงยังใช้เท่าวานิลลาปกติ - ไม่ได้เพิ่มตามจำนวนที่เผา (ยิ่งอัพเกรดสูงยิ่งคุ้มเชื้อเพลิง)
  smelt-batch-size: [1, 8, 16, 24, 32]
  price:
    money: [0, 500, 1500, 3000, 6000]
    item:
      material: ""
      amounts: [0, 8, 16, 32, 64]

hopper:
  display-name: "ฮอปเปอร์"
  max-level: 5
  # ปกติ hopper ย้าย 1 ชิ้น/8 ticks — ค่านี้คือ "จำนวนไอเทมพิเศษ" ที่ย้ายเพิ่มในรอบเดียวกัน
  extra-transfers: [0, 1, 2, 3, 4, 6]
  price:
    money: [0, 300, 800, 1500, 2500, 4000]
    item:
      material: ""
      amounts: [0, 4, 8, 16, 24, 32]

dispenser:
  display-name: "ดิสเพนเซอร์"
  max-level: 5
  # จำนวนไอเทมพิเศษที่ยิง/ดันออกเพิ่ม ต่อการทำงาน 1 ครั้ง (นอกเหนือจากของปกติ 1 ชิ้น)
  extra-items: [0, 1, 2, 3, 4, 5]
  price:
    money: [0, 300, 800, 1500, 2500, 4000]
    item:
      material: ""
      amounts: [0, 8, 16, 32, 48, 64]

dropper:
  display-name: "ดรอปเปอร์"
  max-level: 5
  # จำนวนไอเทมพิเศษที่ดันออกเพิ่ม ต่อการทำงาน 1 ครั้ง (นอกเหนือจากของปกติ 1 ชิ้น)
  extra-items: [0, 1, 2, 3, 4, 5]
  price:
    money: [0, 300, 800, 1500, 2500, 4000]
    item:
      material: ""
      amounts: [0, 8, 16, 32, 48, 64]

crafter:
  display-name: "คราฟเตอร์"
  max-level: 5
  # จำนวนครั้งที่คราฟเพิ่มเติมต่อการทริกเกอร์ 1 ครั้ง (ใช้วัตถุดิบซ้ำจากช่องเดิม)
  # หมายเหตุ: Crafter เป็นบล็อกใหม่ (1.21+) API ยังไม่นิ่งเท่า furnace/hopper/dispenser
  cooldown-reduction-ticks: [0, 1, 2, 2, 3, 4]
  price:
    money: [0, 500, 1200, 2200, 3500, 5000]
    item:
      material: ""
      amounts: [0, 4, 8, 12, 16, 20]
